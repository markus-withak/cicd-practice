name: Deploy to ECS

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: 510869689698.dkr.ecr.eu-central-1.amazonaws.com/cicd-practice


on:
  push:
    branches:
      - main

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Run tests
        working-directory: ./app
        run: |
          pip install -r requirements.txt
          pytest

  build-and-push:
    needs: testing
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::510869689698:role/GitHubActionsECRRole
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build & tag docker image
        run: docker build -t $ECR_REPOSITORY:${{ github.sha }} .

      # - name: Push docker image to ECR
      #   run: docker push $ECR_REPOSITORY:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
