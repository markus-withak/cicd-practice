name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Credentials
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 510869689698.dkr.ecr.eu-central-1.amazonaws.com

      - name: Build docker image
        run: docker build -t test-app .

      - name: Tag docker image
        run: docker tag test-app:latest 510869689698.dkr.ecr.eu-central-1.amazonaws.com/cicd-practice:latest

      - name: Push docker image to ECR
        run: docker push 510869689698.dkr.ecr.eu-central-1.amazonaws.com/cicd-practice:latest